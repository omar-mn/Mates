apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mates-gateway
spec:
  gatewayClassName: mates-app-class
  listeners:
  - protocol: HTTP
    port: 80
    name: http
  
  - protocol: HTTPS
    port: 443
    name: https
    tls:
      mode: Terminate
      certificateRefs:
        - name: gw-cert

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mates-app
spec:
  parentRefs:
  - name: mates-gateway
    namespace: mates-app
  rules:
    - matshes:
      - path:
        type: PathPrefix
        value: /
      
      backendRefs:
      - name: front-service
        port: 80