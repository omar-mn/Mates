scope: postgresql-cluster
name: postgres-2

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

restapi:
  listen: 0.0.0.0:8008
  connect_address: patroni2:8008

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 50000 # 50 MB

    postgresql:
      pg_hba:
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: patroni2:5432
  data_dir: /var/lib/postgresql/data

  authentication:
    superuser:
      username: postgres
      password: kirigaya_kazut0

    replication:
        username: replicator
        password: kirigaya_kazut0