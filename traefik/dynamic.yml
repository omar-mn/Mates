http:

  # ROUTERS

  routers:
    front:
      rule:     Host(`localhost`)
      service:  front
      middlewares:
        - common
      entryPoints:
        - nonSecure

    users-svc:
      rule:     Host(`localhost`) && PathPrefix(`/api/auth/`)
      service:  users-svc
      middlewares:
        - common
      entryPoints:
        - nonSecure

    chat-svc:
      rule:     Host(`localhost`) && PathPrefix(`/api/rooms/`)
      service:  chat-svc
      middlewares:
        - common
      entryPoints:
        - nonSecure

    grafana:
      rule:     Host(`localhost`) && PathPrefix(`/monitor/`)
      service:  grafana
      entryPoints:
        - nonSecure

    basuse:
      rule:     Host(`localhost`) && PathPrefix(`/basuse/`)
      service:  basuse
      entryPoints:
        - nonSecure

  # SERVICES

  services:
    front:
      loadBalancer:
        servers:
          - url: http://front:80

    users-svc:
      loadBalancer:
        servers:
          - url: http://users-service:8000

    chat-svc:
      loadBalancer:
        servers:
          - url: http://chat-service:8080

    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000

    basuse:
      loadBalancer:
        servers:
          - url: http://databasus:4005


  # MIDDLEWARES

  middlewares:
    common:
      chain:
        middlewares:
          - compress
          - ratelimit

    compress:
      compress: {}

    ratelimit:
        rateLimit:
          average: 50
          period: 1s
          burst: 60
